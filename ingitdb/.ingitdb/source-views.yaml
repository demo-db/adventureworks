- name: HumanResources.vEmployee
  columns:
    - BusinessEntityID
    - Title
    - FirstName
    - MiddleName
    - LastName
    - Suffix
    - JobTitle
    - PhoneNumber
    - PhoneNumberType
    - EmailAddress
    - EmailPromotion
    - AddressLine1
    - AddressLine2
    - City
    - StateProvinceName
    - PostalCode
    - CountryRegionName
    - AdditionalContactInfo
  createsql: "CREATE VIEW \"HumanResources.vEmployee\" AS\r\nSELECT\r\n    e.\"BusinessEntityID\"\r\n    ,p.\"Title\"\r\n    ,p.\"FirstName\"\r\n    ,p.\"MiddleName\"\r\n    ,p.\"LastName\"\r\n    ,p.\"Suffix\"\r\n    ,e.\"JobTitle\" \r\n    ,pp.\"PhoneNumber\"\r\n    ,pnt.\"Name\" AS \"PhoneNumberType\"\r\n    ,ea.\"EmailAddress\"\r\n    ,p.\"EmailPromotion\"\r\n    ,a.\"AddressLine1\"\r\n    ,a.\"AddressLine2\"\r\n    ,a.\"City\"\r\n    ,sp.\"Name\" AS \"StateProvinceName\"\r\n    ,a.\"PostalCode\"\r\n    ,cr.\"Name\" AS \"CountryRegionName\"\r\n    ,p.\"AdditionalContactInfo\"\r\nFROM \"HumanResources.Employee\" e\r\n\tINNER JOIN \"Person.Person\" p\r\n\tON p.\"BusinessEntityID\" = e.\"BusinessEntityID\"\r\n    INNER JOIN \"Person.BusinessEntityAddress\" bea\r\n    ON bea.\"BusinessEntityID\" = e.\"BusinessEntityID\"\r\n    INNER JOIN \"Person.Address\" a\r\n    ON a.\"AddressID\" = bea.\"AddressID\"\r\n    INNER JOIN \"Person.StateProvince\" sp\r\n    ON sp.\"StateProvinceID\" = a.\"StateProvinceID\"\r\n    INNER JOIN \"Person.CountryRegion\" cr\r\n    ON cr.\"CountryRegionCode\" = sp.\"CountryRegionCode\"\r\n    LEFT OUTER JOIN \"Person.PersonPhone\" pp\r\n    ON pp.BusinessEntityID = p.\"BusinessEntityID\"\r\n    LEFT OUTER JOIN \"Person.PhoneNumberType\" pnt\r\n    ON pp.\"PhoneNumberTypeID\" = pnt.\"PhoneNumberTypeID\"\r\n    LEFT OUTER JOIN \"Person.EmailAddress\" ea\r\n    ON p.\"BusinessEntityID\" = ea.\"BusinessEntityID\""
- name: HumanResources.vEmployeeDepartment
  columns:
    - BusinessEntityID
    - Title
    - FirstName
    - MiddleName
    - LastName
    - Suffix
    - JobTitle
    - Department
    - GroupName
    - StartDate
  createsql: "CREATE VIEW \"HumanResources.vEmployeeDepartment\" AS\r\nSELECT\r\n    e.\"BusinessEntityID\"\r\n    ,p.\"Title\"\r\n    ,p.\"FirstName\"\r\n    ,p.\"MiddleName\"\r\n    ,p.\"LastName\"\r\n    ,p.\"Suffix\"\r\n    ,e.\"JobTitle\"\r\n    ,d.\"Name\" AS \"Department\"\r\n    ,d.\"GroupName\"\r\n    ,edh.\"StartDate\"\r\nFROM \"HumanResources.Employee\" e\r\n\tINNER JOIN \"Person.Person\" p\r\n\tON p.\"BusinessEntityID\" = e.\"BusinessEntityID\"\r\n    INNER JOIN \"HumanResources.EmployeeDepartmentHistory\" edh\r\n    ON e.\"BusinessEntityID\" = edh.\"BusinessEntityID\"\r\n    INNER JOIN \"HumanResources.Department\" d\r\n    ON edh.\"DepartmentID\" = d.\"DepartmentID\"\r\nWHERE edh.EndDate IS NULL"
- name: HumanResources.vEmployeeDepartmentHistory
  columns:
    - BusinessEntityID
    - Title
    - FirstName
    - MiddleName
    - LastName
    - Suffix
    - Shift
    - Department
    - GroupName
    - StartDate
    - EndDate
  createsql: "CREATE VIEW \"HumanResources.vEmployeeDepartmentHistory\" AS\r\nSELECT\r\n    e.\"BusinessEntityID\"\r\n    ,p.\"Title\"\r\n    ,p.\"FirstName\"\r\n    ,p.\"MiddleName\"\r\n    ,p.\"LastName\"\r\n    ,p.\"Suffix\"\r\n    ,s.\"Name\" AS \"Shift\"\r\n    ,d.\"Name\" AS \"Department\"\r\n    ,d.\"GroupName\"\r\n    ,edh.\"StartDate\"\r\n    ,edh.\"EndDate\"\r\nFROM \"HumanResources.Employee\" e\r\n\tINNER JOIN \"Person.Person\" p\r\n\tON p.\"BusinessEntityID\" = e.\"BusinessEntityID\"\r\n    INNER JOIN \"HumanResources.EmployeeDepartmentHistory\" edh\r\n    ON e.\"BusinessEntityID\" = edh.\"BusinessEntityID\"\r\n    INNER JOIN \"HumanResources.Department\" d\r\n    ON edh.\"DepartmentID\" = d.\"DepartmentID\"\r\n    INNER JOIN \"HumanResources.Shift\" s\r\n    ON s.\"ShiftID\" = edh.\"ShiftID\""
- name: Person.vStateProvinceCountryRegion
  columns:
    - StateProvinceID
    - StateProvinceCode
    - IsOnlyStateProvinceFlag
    - StateProvinceName
    - TerritoryID
    - CountryRegionCode
    - CountryRegionName
  createsql: "CREATE VIEW \"Person.vStateProvinceCountryRegion\" AS\r\nSELECT\r\n    sp.\"StateProvinceID\"\r\n    ,sp.\"StateProvinceCode\"\r\n    ,sp.\"IsOnlyStateProvinceFlag\"\r\n    ,sp.\"Name\" AS \"StateProvinceName\"\r\n    ,sp.\"TerritoryID\"\r\n    ,cr.\"CountryRegionCode\"\r\n    ,cr.\"Name\" AS \"CountryRegionName\"\r\nFROM \"Person.StateProvince\" sp\r\n    INNER JOIN \"Person.CountryRegion\" cr\r\n    ON sp.\"CountryRegionCode\" = cr.\"CountryRegionCode\""
- name: Production.vProductAndDescription
  columns:
    - ProductID
    - Name
    - ProductModel
    - CultureID
    - Description
  createsql: "CREATE VIEW \"Production.vProductAndDescription\" AS\r\n\nSELECT\r\n    p.\"ProductID\"\r\n    ,p.\"Name\"\r\n    ,pm.\"Name\" AS \"ProductModel\"\r\n    ,pmx.\"CultureID\"\r\n    ,pd.\"Description\"\r\nFROM \"Production.Product\" p\r\n    INNER JOIN \"Production.ProductModel\" pm\r\n    ON p.\"ProductModelID\" = pm.\"ProductModelID\"\r\n    INNER JOIN \"Production.ProductModelProductDescriptionCulture\" pmx\r\n    ON pm.\"ProductModelID\" = pmx.\"ProductModelID\"\r\n    INNER JOIN \"Production.ProductDescription\" pd\r\n    ON pmx.\"ProductDescriptionID\" = pd.\"ProductDescriptionID\""
