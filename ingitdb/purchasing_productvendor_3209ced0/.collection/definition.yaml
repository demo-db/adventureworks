record_file:
  name: records.json
  format: json
  type: "map[$record_id]map[$field_name]any"
primary_key: ["ProductID","BusinessEntityID"]
columns:
  "ProductID":
    type: int
    required: true
  "BusinessEntityID":
    type: int
    required: true
  "AverageLeadTime":
    type: int
    required: true
  "StandardPrice":
    type: string
    required: true
  "LastReceiptCost":
    type: string
  "LastReceiptDate":
    type: string
  "MinOrderQty":
    type: int
    required: true
  "MaxOrderQty":
    type: int
    required: true
  "OnOrderQty":
    type: int
  "UnitMeasureCode":
    type: string
    required: true
  "ModifiedDate":
    type: string
    required: true
