          "model": "modelspec:///adventureworks.Person_Person",
          "role": "entity"
        }
      ]
    },
    {
      "id": "employee",
      "kind": "entity",
      "description": "People employed in the AdventureWorks organization.",
      "labels": {
        "en": "Employee"
      },
      "extends": "meaning://github.com/meaninggraph/core/employee?ref=982916d73f0a35ff2558b0062f58aa3ac4f24d97",
      "bindings": [
        {
          "model": "modelspec:///adventureworks.HumanResources_Employee",
          "role": "entity"
        }
      ]
    },
    {
      "id": "sales-customer",
      "kind": "entity",
      "description": "Customers recorded for AdventureWorks sales.",
      "labels": {
        "en": "Sales customer"
