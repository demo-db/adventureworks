name: Validate AdventureWorks provider

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the pinned source rebuild and native metadata
        run: python3 scripts/rebuild-source.py --check

      - name: Test the source converter
        run: python3 -m unittest discover -s tests -v

      - name: Install the immutable shared provider generator
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eu
          base="https://raw.githubusercontent.com/demo-db/websites/7b3091478a235f292b8dddf22fa1f64599367e55"
          curl --fail --silent --show-error --location "$base/scripts/provider-tools/generate.py" -o "$RUNNER_TEMP/generate-provider.py"
          printf '%s  %s\n' '3dcdf38a2d1405ec99da8ed83a41d4476181a2fbc3089c4f9f29ac0b330f5921' "$RUNNER_TEMP/generate-provider.py" | sha256sum --check
          curl --fail --silent --show-error --location "$base/schemas/ovdb-database-draft-1.schema.json" -o "$RUNNER_TEMP/ovdb-database-draft-1.schema.json"
          printf '%s  %s\n' '2424ef00acd462ab5a8abc546fe2d1fffbbb5397e312332aedc77b3e73109488' "$RUNNER_TEMP/ovdb-database-draft-1.schema.json" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/provider-generator/scripts/provider-tools" "$RUNNER_TEMP/provider-generator/schemas"
          cp "$RUNNER_TEMP/generate-provider.py" "$RUNNER_TEMP/provider-generator/scripts/provider-tools/generate.py"
          cp "$RUNNER_TEMP/ovdb-database-draft-1.schema.json" "$RUNNER_TEMP/provider-generator/schemas/ovdb-database-draft-1.schema.json"

      - name: Generate provider contracts and exports
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: python3 "$RUNNER_TEMP/provider-generator/scripts/provider-tools/generate.py" --root .

      - name: Assert source views are complete and query support is truthful
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          schema = json.loads(Path("metadata/schema.json").read_text(encoding="utf-8"))
          native = json.loads(Path("metadata/native-objects.json").read_text(encoding="utf-8"))
          views = schema["sourceViews"]
          if len(views) != 20 or len(native["views"]) != 20:
              raise SystemExit("all twenty native SQL Server views must be retained")
          if sum(bool(view["availableAsSqliteView"]) for view in views) != 11:
              raise SystemExit("only the eleven translated views may be advertised as SQLite views")
          executable = {table["name"] for table in schema["tables"] if table["kind"] == "view"}
          if executable != {view["recordset"] for view in views if view["availableAsSqliteView"]}:
              raise SystemExit("SQLite view inventory differs from the translated source views")
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          capabilities = manifest["capabilities"]["ovdb"]
          generator = manifest["generator"]["ovdb"]
          descriptor = json.loads(Path("ovdb-database.json").read_text(encoding="utf-8"))
          if capabilities["available"] is not True or capabilities["readOnly"] is not True or capabilities["query"] is not True or capabilities["deploymentVerified"] is not True:
              raise SystemExit("OVDB must be declared available only for its verified read-only query mount")
          if generator["query"] is not capabilities["query"]:
              raise SystemExit("generator OVDB query capability differs from website capabilities")
          if descriptor["capabilities"] != {"read": True, "query": True, "write": False}:
              raise SystemExit("public descriptor must advertise verified read/query and disabled writes")
          PY

      - name: Install pinned ModelSpec and MeaningGraph tools
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/adventureworks-tools"
          curl --fail --silent --show-error --location 'https://github.com/modelspec-org/cli/releases/download/v0.1.2/modelspec_0.1.2_linux_amd64.tar.gz' -o "$RUNNER_TEMP/modelspec.tar.gz"
          printf '%s  %s\n' '5682552df42cd8f25b78439e1ec52f1c53476e56815590203dd79583415f32c5' "$RUNNER_TEMP/modelspec.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/modelspec.tar.gz" -C "$RUNNER_TEMP/adventureworks-tools" modelspec
          curl --fail --silent --show-error --location 'https://github.com/meaninggraph/cli/releases/download/v0.2.0/meaninggraph_0.2.0_linux_amd64.tar.gz' -o "$RUNNER_TEMP/meaninggraph.tar.gz"
          printf '%s  %s\n' '582c109132d26db1b940e6af757185c821e318ba7aa0ad073e30daa788e15767' "$RUNNER_TEMP/meaninggraph.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/meaninggraph.tar.gz" -C "$RUNNER_TEMP/adventureworks-tools" meaninggraph

      - name: Validate the published ModelSpec and HCL export
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/adventureworks-tools/modelspec" lint --profile publish model
          "$RUNNER_TEMP/adventureworks-tools/modelspec" export --check model/adventureworks.modelspec.hcl model/adventureworks.modelspec.json

      - name: Validate the pinned MeaningGraph and embedded schema
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eu
          core="$(python3 -c 'import json; print(json.load(open("manifest.json"))["generator"]["meaning"]["core"]["revision"])')"
          core_dir="$RUNNER_TEMP/meaninggraph-core"
          git init -q "$core_dir"
          git -C "$core_dir" fetch --quiet --depth=1 'https://github.com/meaninggraph/core.git' "$core"
          git -C "$core_dir" checkout -q --detach "$core"
          cmp <("$RUNNER_TEMP/adventureworks-tools/meaninggraph" schema) "$core_dir/meaning.schema.json"
          "$RUNNER_TEMP/adventureworks-tools/meaninggraph" check model "$core_dir" --address github.com/demo-db/adventureworks=model --graph "github.com/meaninggraph/core=$core_dir"

      - name: Publication front matter opts into both descriptors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          content = Path("OVDB.md").read_text(encoding="utf-8")
          expected = "---\novdb: 1\npublish:\n  - ./ovdb.yaml\n  - ./ovdb-database.json\n---\n"
          if not content.startswith(expected):
              raise SystemExit("OVDB.md must opt in to both ovdb.yaml and ovdb-database.json")
          PY

      - name: Generated files are committed and current
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::source, provider metadata, or generated artifacts are stale"
            exit 1
          fi
